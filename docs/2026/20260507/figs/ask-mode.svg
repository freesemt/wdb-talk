<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="280" height="294" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="400" height="420" rx="12" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="200" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">Ask モード</text>
  <text x="200" y="48" text-anchor="middle" font-size="13" fill="#555">（Chat）</text>

  <!-- ユーザー box 1 -->
  <rect x="130" y="60" width="140" height="46" rx="10" fill="#4a90d9" />
  <text x="200" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="white">ユーザー</text>
  <text x="200" y="99" text-anchor="middle" font-size="12" fill="#d0e8ff">質問・依頼を入力</text>

  <!-- Arrow down -->
  <line x1="200" y1="106" x2="200" y2="130" stroke="#888" stroke-width="2"/>
  <polygon points="200,138 194,125 206,125" fill="#888"/>
  <text x="215" y="122" font-size="11" fill="#888">依頼</text>

  <!-- Copilot box -->
  <rect x="110" y="140" width="180" height="46" rx="10" fill="#6c3483"/>
  <text x="200" y="161" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Copilot</text>
  <text x="200" y="179" text-anchor="middle" font-size="12" fill="#e8d5f5">回答・コード生成</text>

  <!-- Arrow down -->
  <line x1="200" y1="186" x2="200" y2="210" stroke="#888" stroke-width="2"/>
  <polygon points="200,218 194,205 206,205" fill="#888"/>
  <text x="215" y="202" font-size="11" fill="#888">提案</text>

  <!-- ユーザー box 2 -->
  <rect x="130" y="220" width="140" height="46" rx="10" fill="#4a90d9"/>
  <text x="200" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="white">ユーザー</text>
  <text x="200" y="259" text-anchor="middle" font-size="12" fill="#d0e8ff">内容を確認・判断</text>

  <!-- Arrow down -->
  <line x1="200" y1="266" x2="200" y2="290" stroke="#888" stroke-width="2"/>
  <polygon points="200,298 194,285 206,285" fill="#888"/>
  <text x="215" y="282" font-size="11" fill="#888">手動適用</text>

  <!-- Editor/Terminal box -->
  <rect x="100" y="300" width="200" height="46" rx="10" fill="#2e7d32"/>
  <text x="200" y="321" text-anchor="middle" font-size="14" font-weight="bold" fill="white">エディタ / ターミナル</text>
  <text x="200" y="339" text-anchor="middle" font-size="12" fill="#c8e6c9">ユーザーが操作</text>

  <!-- Note -->
  <rect x="30" y="360" width="340" height="46" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2"/>
  <text x="200" y="379" text-anchor="middle" font-size="12" fill="#555">人間が毎回判断・操作する</text>
  <text x="200" y="397" text-anchor="middle" font-size="12" fill="#555">シンプルな 一往復フロー</text>

</svg>
